spring:
  application:
    name: todos-api
  datasource:
    url: jdbc:h2:file:./data/todos
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 18080
