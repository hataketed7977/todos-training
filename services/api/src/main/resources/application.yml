spring:
  application:
    name: todos-api
  datasource:
    url: jdbc:h2:mem:todos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 18080

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:15173}
